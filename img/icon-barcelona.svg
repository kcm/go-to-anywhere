<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2d50"/>
      <stop offset="55%" stop-color="#8c3b4a"/>
      <stop offset="100%" stop-color="#f2a65a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6cc"/>
      <stop offset="55%" stop-color="#d9bc8c"/>
      <stop offset="100%" stop-color="#a88451"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <!-- Catalan sun glow -->
  <circle cx="256" cy="184" r="98" fill="#ffd166" opacity="0.28"/>
