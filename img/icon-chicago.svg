<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="55%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b2d42"/>
      <stop offset="55%" stop-color="#1f2433"/>
      <stop offset="100%" stop-color="#12151f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <!-- Chicago Flag Six-Pointed Red Stars & Sky Blue Stripe in Upper Sky -->
  <rect x="56" y="88" width="400" height="24" rx="12" fill="#7CC6FE" opacity="0.22"/>
  <g fill="#e63946">
    <polygon points="104,76 109,90 124,90 112,99 116,113 104,104 92,113 96,99 84,90 99,90"/>
    <polygon points="408,76 413,90 428,90 416,99 420,113 408,104 396,113 400,99 388,90 403,90"/>
  </g>
  <!-- 875 N Michigan (John Hancock Center) X-braced silhouette on right -->
  <polygon points="348,384 358,162 412,162 422,384" fill="#1e293b" stroke="#64748b" stroke-width="2.5"/>
  <line x1="356" y1="162" x2="420" y2="236" stroke="#64748b" stroke-width="2.5"/>
  <line x1="414" y1="162" x2="350" y2="236" stroke="#64748b" stroke-width="2.5"/>
  <line x1="352" y1="236" x2="422" y2="318" stroke="#64748b" stroke-width="2.5"/>
  <line x1="418" y1="236" x2="348" y2="318" stroke="#64748b" stroke-width="2.5"/>
  <line x1="370" y1="162" x2="370" y2="118" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="400" y1="162" x2="400" y2="118" stroke="#e2e8f0" stroke-width="3"/>
  <!-- Iconic Willis (Sears) Tower Bundled-Tube Stepbacks & Twin White Antennas -->
  <!-- Twin Antennas -->
  <line x1="226" y1="42" x2="226" y2="108" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="262" y1="42" x2="262" y2="108" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <rect x="218" y="96" width="16" height="12" fill="#cbd5e1"/>
  <rect x="254" y="96" width="16" height="12" fill="#cbd5e1"/>
  <!-- Top 2-tube tier (floors 90-108) -->
  <rect x="210" y="108" width="68" height="58" fill="url(#tower)" stroke="#94a3b8" stroke-width="3"/>
  <!-- Upper-middle tier (floors 66-90) -->
  <rect x="188" y="166" width="112" height="68" fill="url(#tower)" stroke="#94a3b8" stroke-width="3"/>
  <!-- Lower-middle tier (floors 50-66) -->
  <rect x="172" y="234" width="144" height="56" fill="url(#tower)" stroke="#94a3b8" stroke-width="3"/>
  <!-- Base 9-tube tier (floors 1-50) -->
  <rect x="156" y="290" width="176" height="94" fill="url(#tower)" stroke="#94a3b8" stroke-width="3.5"/>
  <!-- Skydeck Ledge Glass Box -->
  <rect x="200" y="124" width="10" height="16" fill="#7CC6FE" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Bundled tube grid lines & lit windows -->
  <g stroke="#475569" stroke-width="2">
    <line x1="244" y1="108" x2="244" y2="384"/>
    <line x1="214" y1="166" x2="214" y2="384"/>
    <line x1="274" y1="166" x2="274" y2="384"/>
  </g>
  <!-- Iconic Chicago River Red Steel Trunnion Bascule Bridge in foreground -->
  <g stroke="#d90429" stroke-width="5" fill="none" stroke-linejoin="round">
    <polygon points="64,384 188,354 188,384"/>
    <line x1="96" y1="376" x2="124" y2="384"/>
    <line x1="124" y1="369" x2="156" y2="384"/>
    <line x1="156" y1="362" x2="188" y2="384"/>
    <polygon points="448,384 324,354 324,384"/>
    <line x1="416" y1="376" x2="388" y2="384"/>
    <line x1="388" y1="369" x2="356" y2="384"/>
    <line x1="356" y1="362" x2="324" y2="384"/>
  </g>
  <!-- Bridge tender stone houses -->
  <rect x="44" y="346" width="28" height="46" fill="#d6ccc2" stroke="#475569" stroke-width="2.5"/>
  <rect x="440" y="346" width="28" height="46" fill="#d6ccc2" stroke="#475569" stroke-width="2.5"/>
  <!-- Emerald Green Chicago River Water -->
  <path d="M0 388 L512 388 L512 512 L0 512 Z" fill="#136f63"/>
  <path d="M78 426 Q168 414 258 426 T438 426" fill="none" stroke="#80ed99" stroke-width="5" stroke-linecap="round"/>
  <path d="M114 464 Q204 452 294 464 T414 464" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
