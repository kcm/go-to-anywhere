<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Outer Royal Gold frame -->
  <rect x="6" y="6" width="244" height="244" rx="54" fill="#e5a928"/>
  <!-- Deep Royal Blue background -->
  <rect x="18" y="18" width="220" height="220" rx="44" fill="#102344"/>
  <!-- Inner Pale Gold pinstripe -->
  <rect x="23" y="23" width="210" height="210" rx="40" fill="none" stroke="#f7de9c" stroke-width="3"/>

  <!-- Left & Right Royal Oak Leaf / Acorn Sprigs -->
  <path d="M 88 158 C 66 150 56 128 66 112 C 74 100 84 106 86 116 C 84 96 96 86 104 98" fill="none" stroke="#e5a928" stroke-width="5" stroke-linecap="round"/>
  <path d="M 168 158 C 190 150 200 128 190 112 C 182 100 172 106 170 116 C 172 96 160 86 152 98" fill="none" stroke="#e5a928" stroke-width="5" stroke-linecap="round"/>
  <!-- Acorns -->
  <circle cx="72" cy="144" r="7" fill="#e5a928"/>
  <circle cx="184" cy="144" r="7" fill="#e5a928"/>

  <!-- Shrine of the Little Flower Art Deco Octagonal Tower -->
  <!-- Stepped Base -->
  <path d="M 92 184 L 164 184 L 156 164 L 100 164 Z" fill="#e5a928"/>
  <!-- Main Octagonal Shaft -->
  <rect x="108" y="76" width="40" height="88" rx="2" fill="#f3c44e"/>
  <!-- Upper Stepped Belfry Tier -->
  <rect x="114" y="56" width="28" height="22" rx="2" fill="#e5a928"/>
  <!-- Crown / Cross Finial -->
  <rect x="125" y="40" width="6" height="18" rx="1.5" fill="#f7de9c"/>
  <rect x="119" y="45" width="18" height="5" rx="1.5" fill="#f7de9c"/>

  <!-- Art Deco Vertical Fluting & Relief Cross on Shrine Tower -->
  <line x1="128" y1="62" x2="128" y2="146" stroke="#102344" stroke-width="5" stroke-linecap="round"/>
  <line x1="116" y1="88" x2="140" y2="88" stroke="#102344" stroke-width="5" stroke-linecap="round"/>
  <line x1="116" y1="116" x2="116" y2="160" stroke="#102344" stroke-width="2.5"/>
  <line x1="140" y1="116" x2="140" y2="160" stroke="#102344" stroke-width="2.5"/>

  <!-- Woodward Ave / 11 Mile Horizon Bars -->
  <rect x="58" y="196" width="140" height="7" rx="3.5" fill="#e5a928"/>
  <rect x="76" y="212" width="104" height="7" rx="3.5" fill="#f7de9c"/>
</svg>
