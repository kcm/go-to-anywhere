  <path d="M 142 172 C 160 146, 172 114, 160 66" fill="none" stroke="#f7de9c" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Central Royal Oak Acorn -->
  <!-- Acorn Stem -->
  <path d="M 128 66 C 128 52, 136 44, 142 40" fill="none" stroke="#f7de9c" stroke-width="7" stroke-linecap="round"/>

  <!-- Acorn Nut Body -->
  <path d="M 94 110
           L 162 110
           C 164 148, 150 176, 128 190
           C 106 176, 92 148, 94 110 Z"
