  <!-- Cupule Cross-Hatch Scales -->
  <path d="M 96 84 L 112 108 M 112 74 L 132 108 M 132 74 L 152 108 M 150 80 L 162 104" stroke="#102344" stroke-width="3" stroke-linecap="round"/>
  <path d="M 160 84 L 144 108 M 144 74 L 124 108 M 124 74 L 104 108 M 106 80 L 94 104" stroke="#102344" stroke-width="3" stroke-linecap="round"/>

  <!-- Horizon Bars -->
  <rect x="64" y="204" width="128" height="7" rx="3.5" fill="#e5a928"/>
  <rect x="84" y="218" width="88" height="6" rx="3" fill="#f7de9c"/>
