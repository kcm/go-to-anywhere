           C 94 170, 74 156, 66 142
           C 56 142, 46 132, 52 120
           C 60 112, 70 118, 72 114
           C 60 104, 56 88, 66 80
           C 76 72, 88 84, 92 80
           C 86 68, 92 54, 102 56
           C 112 58, 114 72, 114 84
           Z"
        fill="#2e6f40" stroke="#f7de9c" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left Oak Leaf central vein -->
  <path d="M 114 172 C 96 146, 84 114, 96 66" fill="none" stroke="#f7de9c" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Right White Oak Leaf (lobed silhouette) -->
  <path d="M 140 178
           C 162 170, 182 156, 190 142
           C 200 142, 210 132, 204 120
           C 196 112, 186 118, 184 114
           C 196 104, 200 88, 190 80
           C 180 72, 168 84, 164 80
