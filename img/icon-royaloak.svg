  <!-- Acorn Nut Specular Highlight -->
  <path d="M 108 120 C 106 144, 114 164, 124 174" fill="none" stroke="#f7de9c" stroke-width="5" stroke-linecap="round"/>
  <!-- Acorn Basal Tip -->
  <circle cx="128" cy="191" r="4.5" fill="#f7de9c"/>

  <!-- Acorn Cupule (Cap) -->
  <path d="M 84 102
           C 84 78, 104 64, 128 64
