  <!-- Deep Royal Blue background -->
  <rect x="18" y="18" width="220" height="220" rx="44" fill="#102344"/>
  <!-- Inner Pale Gold pinstripe -->
  <rect x="23" y="23" width="210" height="210" rx="40" fill="none" stroke="#f7de9c" stroke-width="3"/>

  <!-- Left White Oak Leaf (lobed silhouette) -->
