<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Outer NYC Subway Gold frame -->
  <rect x="6" y="6" width="244" height="244" rx="54" fill="#f2af1e"/>
  <!-- Gotham Midnight Navy background -->
  <rect x="18" y="18" width="220" height="220" rx="44" fill="#0c192c"/>
  <!-- Liberty Patina Green/Gold inner pinstripe -->
  <rect x="23" y="23" width="210" height="210" rx="40" fill="none" stroke="#68c9b0" stroke-width="3"/>

  <!-- Liberty Crown Radiant Rays behind Empire State Spire -->
  <g stroke="#68c9b0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75">
    <line x1="94" y1="84" x2="72" y2="66"/>
    <line x1="88" y1="104" x2="62" y2="96"/>
    <line x1="162" y1="84" x2="184" y2="66"/>
    <line x1="168" y1="104" x2="194" y2="96"/>
  </g>

  <!-- Flanking Manhattan Skyscrapers -->
  <rect x="64" y="128" width="26" height="56" rx="2" fill="#4ca892"/>
  <rect x="70" y="116" width="14" height="14" rx="1" fill="#4ca892"/>
  <rect x="166" y="122" width="26" height="62" rx="2" fill="#4ca892"/>
  <polygon points="166,122 179,102 192,122" fill="#68c9b0"/>

  <!-- Empire State Building Art Deco Setbacks & Spire -->
  <!-- Needle Antenna -->
  <line x1="128" y1="36" x2="128" y2="60" stroke="#f7dc88" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Mooring Mast -->
  <rect x="121" y="58" width="14" height="18" rx="2" fill="#f7dc88"/>
  <!-- Upper Setback -->
  <rect x="113" y="74" width="30" height="24" rx="2" fill="#f2af1e"/>
  <!-- Mid Setback -->
  <rect x="105" y="96" width="46" height="44" rx="2" fill="#f2af1e"/>
  <!-- Lower Base -->
  <rect x="97" y="138" width="62" height="46" rx="2" fill="#f2af1e"/>

  <!-- Art Deco Window Columns -->
  <g stroke="#0c192c" stroke-width="3">
    <line x1="120" y1="80" x2="120" y2="178"/>
    <line x1="128" y1="80" x2="128" y2="178"/>
    <line x1="136" y1="80" x2="136" y2="178"/>
    <line x1="111" y1="104" x2="111" y2="178"/>
    <line x1="145" y1="104" x2="145" y2="178"/>
  </g>

  <!-- Hudson & East River Bars -->
  <rect x="58" y="196" width="140" height="7" rx="3.5" fill="#f2af1e"/>
  <rect x="76" y="212" width="104" height="7" rx="3.5" fill="#68c9b0"/>
</svg>
